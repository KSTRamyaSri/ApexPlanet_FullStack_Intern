<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Login | AuthPortal</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div id="navbar-placeholder"></div>

<section class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="row auth-card overflow-hidden">

<div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center p-5 bg-custom">
<img class="auth-svg mb-5" src="assets/Mobile login-pana.png">
<h1 class="fw-bold display-5 color-primary">

Welcome Back

</h1>

<p class="mt-3">

Sign in to continue your secure experience.

</p>

</div>

<div class="col-lg-6 p-5">

<h2 class="fw-bold mb-4">

Login

</h2>

<form id="loginForm">

<div class="mb-4">

<label class="form-label">

Email

</label>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-envelope"></i>

</span>

<input
type="email"
id="loginUser"
class="form-control"
placeholder="Enter email">

</div>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-lock"></i>

</span>

<input
type="password"
id="loginPassword"
class="form-control toggle-password"
placeholder="Password">

<button
type="button"
class="btn btn-light pass-toggle">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<div class="d-flex justify-content-between mb-4">

<div>

<input type="checkbox">

Remember Me

</div>

<a href="#">

Forgot Password?

</a>

</div>

<button
class="btn btn-custom w-100">

Sign In

</button>

<p class="text-center mt-4">

No account?

<a href="register.html">

Create one

</a>

</p>

</form>

</div>

</div>

</div>

</div>

</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

<script src="js/validation.js"></script>

</body>

</html>

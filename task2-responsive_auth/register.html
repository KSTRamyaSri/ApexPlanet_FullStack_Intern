<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Register | AuthPortal</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div id="navbar-placeholder"></div>

<section class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">
    

<div class="row auth-card overflow-hidden">

<div class="col-lg-6 d-none d-lg-flex bg-custom p-5 flex-column justify-content-center">
<img class="auth-svg mb-5" src="assets/Filing system-pana.png">
<h1 class="display-5 fw-bold color-primary">

Create Account

</h1>

<p class="mt-3">

Responsive registration UI with validation and AJAX.

</p>

</div>

<div class="col-lg-6 p-5">

<h2 class="fw-bold mb-4">

Register

</h2>

<form id="registerForm">

<div class="mb-3">

<label class="form-label">

Username

</label>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-user"></i>

</span>

<input
type="text"
id="regUsername"
class="form-control"
placeholder="Username">

</div>

<div
id="usernameFeedback"
class="small mt-2">

</div>

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-envelope"></i>

</span>

<input
type="email"
id="regEmail"
class="form-control"
placeholder="name@example.com">

</div>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-lock"></i>

</span>

<input
type="password"
id="regPassword"
class="form-control toggle-password">

<button
type="button"
class="btn btn-light pass-toggle">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<div class="mb-4">

<label class="form-label">

Confirm Password

</label>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-circle-check"></i>

</span>

<input
type="password"
id="regConfirmPassword"
class="form-control">

</div>

<div class="invalid-feedback">

Passwords do not match

</div>

</div>

<button
class="btn btn-custom w-100">

Create Account

</button>

<p class="text-center mt-4">

Already registered?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</div>

</div>

</div>

</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

<script src="js/validation.js"></script>

<script src="js/ajax.js"></script>

</body>

</html>
